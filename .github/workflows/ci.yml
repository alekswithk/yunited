name: CI

# Runs on every PR to main and on pushes to main. The build step loads the
# content collections through src/lib/content.js, so it validates every
# events/members entry against the Zod schema — a bad /admin edit or hand-edit fails
# here, before merge, instead of only when Cloudflare tries to deploy.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Lets main be re-checked on demand — from the Actions tab, or `gh workflow
  # run ci.yml`. Before this, the only way to know whether main was still
  # green after a hosted-runner outage (2026-08-06: two merges produced no
  # runs at all) was to push a new commit.
  workflow_dispatch:

# A newer push to the same branch/PR cancels the older, still-running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-check:
    name: Build & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Unit tests for src/lib and worker/ — the build-time logic that decides
      # what the events page shows, and the admin Worker's logic that decides
      # what gets committed. A bug in either does not fail a build, it just
      # renders or writes the wrong thing, so this runs before the build.
      - name: Test
        run: npm test

      # Runs the `prebuild` step (mirrors src/images for /admin) then `astro build`,
      # which is also where content validation happens.
      - name: Build
        run: npm run build

      - name: Type-check
        run: npm run check

      # Asserts on the BUILT output: no style="…" attributes and no inline
      # <script>, both of which the site's CSP forbids without 'unsafe-inline'.
      # Nothing else catches this — build and check both stay green while the
      # page silently breaks in any browser that enforces the header. See the
      # comment at the top of scripts/check-dist.mjs.
      - name: Check built output
        run: npm run check:dist

      # Non-blocking: dev-tooling CVEs here never reach a visitor or the
      # deployed Worker (see PLAN.md §5), so this reports rather than fails.
      # It exists because the count drifted 0 -> 7 across four separate checks
      # with nothing in CI saying so each time — this is what makes the next
      # drift visible in a PR instead of only to whoever next runs it by hand.
      - name: Dependency audit (report only)
        run: npm audit --audit-level=high || true
