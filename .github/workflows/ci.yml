name: CI

# Runs on every PR to main and on pushes to main. The build step loads the
# content collections through src/lib/content.js, so it validates every
# events/members entry against the Zod schema — a bad CMS edit or hand-edit fails
# here, before merge, instead of only when Cloudflare tries to deploy.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to the same branch/PR cancels the older, still-running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-check:
    name: Build & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Unit tests for src/lib — the build-time logic that decides what the
      # events page shows. A bug there does not fail a build, it just renders
      # the wrong thing, so this runs before the build rather than after.
      - name: Test
        run: npm test

      # Runs the `prebuild` step (vendors the CMS bundle) then `astro build`,
      # which is also where content validation happens.
      - name: Build
        run: npm run build

      - name: Type-check
        run: npm run check

      # Asserts on the BUILT output: no style="…" attributes and no inline
      # <script>, both of which the site's CSP forbids without 'unsafe-inline'.
      # Nothing else catches this — build and check both stay green while the
      # page silently breaks in any browser that enforces the header. See the
      # comment at the top of scripts/check-dist.mjs.
      - name: Check built output
        run: npm run check:dist
